<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bấm đúng thời điểm</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #counter {
      font-size: 48px;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
    }
    #message {
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
    #target {
      font-size: 24px;
      margin-top: 10px;
      color: darkgreen;
    }
  </style>
</head>
<body>
  <h1>⏱️ Bấm đúng thời điểm</h1>
  <p>Hãy bấm nút khi bộ đếm đạt đến số bí mật!</p>
  <div id="target">Số bí mật: ?</div>
  <div id="counter">0</div>
  <button onclick="startGame()">Bắt đầu</button>
  <button onclick="stopCounter()">Bấm ngay!</button>
  <div id="message"></div>

  <script>
    let count = 0;
    let interval;
    let isPlaying = false;
    let target = 0;

    function startGame() {
      if (isPlaying) return;
      count = 0;
      target = Math.floor(Math.random() * 81) + 20; // số từ 20 đến 100
      document.getElementById("counter").innerText = count;
      document.getElementById("target").innerText = `Số bí mật: ${target}`;
      document.getElementById("message").innerText = "";
      isPlaying = true;

      interval = setInterval(() => {
        count++;
        document.getElementById("counter").innerText = count;
        if (count >= 150) {
          clearInterval(interval);
          isPlaying = false;
          document.getElementById("message").innerText = "⛔ Bạn đã quá chậm!";
        }
      }, 50);
    }

    function stopCounter() {
      if (!isPlaying) return;
      clearInterval(interval);
      isPlaying = false;

      if (count === target) {
        document.getElementById("message").innerText = "🎉 Phần thưởng của vợ là 1 cái hôn";
      } else {
        document.getElementById("message").innerText = "❌ Sai rồi nào đúng thì mới được dừng!";
      }
    }
  </script>
</body>
</html>
